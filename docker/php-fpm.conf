; CornerTill PHP-FPM settings. Loaded after www.conf and zz-docker.conf.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; nginx runs in the same container.
listen = 127.0.0.1:9000
; Keep container variables for PHP (config is also cached at start).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
