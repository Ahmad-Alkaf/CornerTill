# CornerTill nginx (runs as www-data on port 8080, behind the Coolify proxy).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/manifest+json webmanifest;
    }
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080 default_server;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Vite assets have a content hash in the file name, so a file never
        # changes: browsers can keep it for a year.
        location /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri @build_missing;
        }

        # A missing asset must not be cached. During a rolling deploy the old
        # container can get a request for a new file name; if a browser (or the
        # Cloudflare Browser Cache TTL) keeps that 404, the page stays blank.
        # A named location has its own add_header set, so no immutable header.
        location @build_missing {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            return 404;
        }

        # Translations (i18next) have no hash in the file name: the browser
        # must check for a new version (ETag) each time.
        location /locales/ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # User uploads (links to storage/app/public). Never run scripts here;
        # an uploaded SVG cannot run JavaScript.
        location ~ ^/(products-images|businesses-logo)/ {
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Only the Laravel front controller runs PHP.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
            # Laravel sends a long Link header (Vite preloads) on Inertia pages.
            fastcgi_buffer_size 64k;
            fastcgi_buffers 16 32k;
            fastcgi_busy_buffers_size 128k;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
